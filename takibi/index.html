<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>焚き火 — takibi</title>
<style>
  :root{
    --ink:#e8dcc8;
    --ink-dim:rgba(232,220,200,.55);
    --ember:#ff8c2e;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:#05060d; }
  body{
    font-family:"Hiragino Mincho ProN","Yu Mincho","BIZ UDMincho",serif;
    color:var(--ink);
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #cv{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:pointer; }

  /* ---- title ---- */
  #title{
    position:fixed; top:9%; left:0; right:0; text-align:center;
    font-size:clamp(26px,4.5vw,44px); letter-spacing:.9em; text-indent:.9em;
    color:var(--ink-dim); pointer-events:none;
    transition:opacity 2.4s ease; text-shadow:0 0 24px rgba(255,140,46,.15);
  }
  #title.hide{ opacity:0; }

  /* ---- center message ---- */
  #msg{
    position:fixed; left:0; right:0; top:25%; text-align:center;
    font-size:clamp(15px,2.4vw,21px); letter-spacing:.28em; text-indent:.28em;
    color:var(--ink); opacity:0; pointer-events:none;
    text-shadow:0 2px 18px rgba(0,0,0,.8);
    transition:opacity 1.1s ease;
  }
  #msg.show{ opacity:.92; }

  /* ---- reward banner ---- */
  #banner{
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1.2em;
    pointer-events:none; opacity:0; transition:opacity 2.2s ease;
  }
  #banner.show{ opacity:1; }
  #banner .b1{
    font-size:clamp(26px,5vw,48px); letter-spacing:.6em; text-indent:.6em;
    text-shadow:0 0 30px rgba(255,140,46,.45), 0 2px 20px rgba(0,0,0,.9);
  }
  #banner .b2{
    font-size:clamp(13px,2vw,17px); letter-spacing:.34em; text-indent:.34em;
    color:var(--ink-dim); text-shadow:0 2px 14px rgba(0,0,0,.9);
  }

  /* ---- wood bar（右下すみ・小型） ---- */
  #woodbar{
    position:fixed; right:max(14px, env(safe-area-inset-right));
    bottom:max(14px, env(safe-area-inset-bottom));
    display:flex; gap:8px; z-index:5; align-items:flex-end;
    transition:opacity 1.6s ease;
  }
  #woodbar.faded{ opacity:.06; }
  .wood{
    appearance:none; border:1px solid rgba(232,220,200,.2);
    background:rgba(8,8,14,.42); color:var(--ink);
    width:clamp(54px,13vw,70px); padding:8px 4px 7px;
    border-radius:10px; cursor:pointer; backdrop-filter:blur(5px);
    font-family:inherit; letter-spacing:.14em; text-indent:.14em; font-size:11px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    transition:border-color .5s, box-shadow .5s, transform .12s, opacity .3s;
  }
  .wood:active{ transform:scale(.94); }
  .wood.ready{ border-color:rgba(255,150,60,.65); box-shadow:0 0 18px rgba(255,120,30,.22), inset 0 0 14px rgba(255,120,30,.08); }
  .wood.cool{ opacity:.4; pointer-events:none; }
  .wood .bars{ display:flex; flex-direction:column; gap:2px; align-items:center; height:13px; justify-content:center; }
  .wood .bars i{ display:block; background:#6b4a2e; border-radius:2px; box-shadow:inset 0 1px 0 rgba(255,255,255,.12); }
  .wood[data-i="0"] .bars i{ width:22px; height:2px; }
  .wood[data-i="1"] .bars i{ width:30px; height:3px; }
  .wood[data-i="2"] .bars i{ width:38px; height:5px; }
  .wood .need{ display:none; }

  /* ---- fire gauge（火力＋各薪の適正閾値・左下すみ） ---- */
  #firebar{
    position:fixed; left:max(16px, env(safe-area-inset-left));
    bottom:max(16px, env(safe-area-inset-bottom));
    width:min(215px, 52vw); z-index:5; pointer-events:none;
    display:flex; flex-direction:column; gap:20px;
    transition:opacity 1.6s ease;
  }
  #firebar.faded{ opacity:.1; }
  #firebar .frow{ display:flex; align-items:center; gap:12px; width:100%; }
  #firebar .fl{ font-size:10px; letter-spacing:.35em; color:var(--ink-dim); white-space:nowrap; }
  #egauge{ position:relative; flex:1; height:4px; border-radius:2px; background:rgba(232,220,200,.1); }
  #egauge b{
    display:block; height:100%; width:0%;
    background:linear-gradient(90deg,#4a1204,#b83c0c,#ff6a1a);
    border-radius:2px; transition:width .4s linear;
    box-shadow:0 0 8px rgba(230,80,20,.5);
  }
  #fgauge{ position:relative; flex:1; height:7px; border-radius:4px; background:rgba(232,220,200,.13); }
  #fgauge b{
    display:block; height:100%; width:0%;
    background:linear-gradient(90deg,#8c2f0a,#ff7a1a,#ffd062);
    border-radius:4px; transition:width .2s linear;
    box-shadow:0 0 10px rgba(255,140,40,.55);
  }
  #fgauge .tick{ position:absolute; top:-4px; width:0; height:15px; }
  #fgauge .tick i{
    position:absolute; left:-1px; top:0; width:2px; height:15px;
    background:rgba(232,220,200,.4); border-radius:1px;
    transition:background .4s, box-shadow .4s;
  }
  #fgauge .tick em{
    position:absolute; left:0; top:15px; transform:translateX(-50%);
    font-style:normal; font-size:9px; letter-spacing:.08em;
    color:var(--ink-dim); white-space:nowrap; transition:color .4s, text-shadow .4s;
  }
  #fgauge .tick.passed i{ background:var(--ember); box-shadow:0 0 8px rgba(255,140,40,.85); }
  #fgauge .tick.passed em{ color:var(--ember); text-shadow:0 0 10px rgba(255,140,40,.5); }
  /* 狭い画面では左右のUIが底辺でぶつかるため、ゲージをボタンの上に退避 */
  @media (max-width: 560px){
    #firebar{ left:max(14px, env(safe-area-inset-left)); bottom:calc(max(14px, env(safe-area-inset-bottom)) + 92px); }
  }

  /* ---- top bar ---- */
  #topbar{
    position:fixed; top:max(14px, env(safe-area-inset-top)); right:max(16px, env(safe-area-inset-right));
    display:flex; gap:10px; align-items:center; z-index:6;
    transition:opacity 1.6s ease;
  }
  #topbar.faded{ opacity:.1; }
  #clock{
    font-size:12px; letter-spacing:.24em; color:var(--ink-dim);
    display:none;
  }
  #sndbtn{
    appearance:none; border:1px solid rgba(232,220,200,.22); border-radius:10px;
    background:rgba(10,10,16,.5); color:var(--ink-dim); cursor:pointer;
    font-family:inherit; font-size:12px; letter-spacing:.2em; text-indent:.1em;
    padding:7px 13px; transition:color .3s, border-color .3s;
  }
  #sndbtn.on{ color:var(--ember); border-color:rgba(255,150,60,.4); }
  #helpbtn{
    appearance:none; border:1px solid rgba(232,220,200,.22); border-radius:10px;
    background:rgba(10,10,16,.5); color:var(--ink-dim); cursor:pointer;
    font-family:inherit; font-size:12px; padding:7px 12px;
  }

  /* ---- fan button（団扇） ---- */
  #fanbtn{
    appearance:none; border:1px solid rgba(255,160,70,.4);
    background:rgba(20,12,8,.5); color:var(--ink);
    width:clamp(58px,14vw,78px); padding:9px 4px 8px;
    border-radius:12px; cursor:pointer; backdrop-filter:blur(5px);
    font-family:inherit; letter-spacing:.14em; text-indent:.14em; font-size:12px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    transition:border-color .4s, box-shadow .4s, transform .08s, opacity .3s;
    box-shadow:0 0 12px rgba(255,120,30,.12);
  }
  #fanbtn:active{ transform:scale(.9); }
  #fanbtn.cool{ opacity:.45; pointer-events:none; }
  #fanbtn.guide{ animation:wpulse 1.6s ease-in-out infinite; }
  #fanbtn svg{ transform-origin:50% 90%; }
  #fanbtn.swing svg{ animation:fswing .32s ease; }
  @keyframes fswing{
    0%{ transform:rotate(0); } 30%{ transform:rotate(-30deg); }
    70%{ transform:rotate(22deg); } 100%{ transform:rotate(0); }
  }
  #fanbtn .fs{ font-size:10px; letter-spacing:.3em; text-indent:.3em; color:var(--ink-dim); }

  /* ---- step guide (tutorial・空のあたりに出す) ---- */
  #guide{
    position:fixed; left:50%; top:15.5%;
    transform:translateX(-50%); text-align:center; z-index:4; pointer-events:none;
    max-width:92vw; opacity:0; transition:opacity .9s ease;
  }
  #guide.show{ opacity:1; }
  #guide .gstep{
    display:block; font-size:10px; letter-spacing:.5em; text-indent:.5em;
    color:var(--ember); margin-bottom:7px;
  }
  #guide .gtext{
    display:block; font-size:clamp(14px,2.2vw,18px); letter-spacing:.24em; text-indent:.24em;
    color:var(--ink); text-shadow:0 2px 16px rgba(0,0,0,.85);
    animation:gpulse 2.6s ease-in-out infinite;
  }
  @keyframes gpulse{ 0%,100%{opacity:.72} 50%{opacity:1} }
  .wood.guide{ animation:wpulse 1.6s ease-in-out infinite; }
  @keyframes wpulse{
    0%,100%{ box-shadow:0 0 8px rgba(255,120,30,.12); }
    50%{ box-shadow:0 0 26px rgba(255,140,40,.55); border-color:rgba(255,170,80,.9); }
  }

  /* ---- help overlay ---- */
  #help{
    position:fixed; inset:0; z-index:20; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:2em;
    background:rgba(3,4,10,.88); backdrop-filter:blur(5px); cursor:pointer;
  }
  #help.show{ display:flex; }
  #help h2{
    font-size:clamp(18px,3vw,24px); font-weight:normal;
    letter-spacing:.7em; text-indent:.7em; color:var(--ink);
  }
  #help .rows{ display:flex; flex-direction:column; gap:1.1em; width:min(540px,88vw); }
  #help .row{ display:flex; gap:1.4em; align-items:baseline; font-size:clamp(12px,1.9vw,15px); line-height:1.9; }
  #help .k{ color:var(--ember); letter-spacing:.12em; min-width:9.5em; text-align:right; flex-shrink:0; }
  #help .v{ color:var(--ink); letter-spacing:.1em; }
  #help .close{ font-size:11px; letter-spacing:.4em; text-indent:.4em; color:var(--ink-dim); margin-top:1em; }
  #help .credit{ font-size:10px; letter-spacing:.2em; color:var(--ink-dim); opacity:.65; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title">焚　火</div>
<div id="msg"></div>
<div id="banner">
  <div class="b1">熾火になった</div>
  <div class="b2">もう、この火は消えない。あとは、ただ眺めるだけ。</div>
</div>

<div id="firebar">
  <div class="frow">
    <span class="fl">火力</span>
    <div id="fgauge">
      <b id="ffill"></b>
      <span class="tick" id="tick0"><i></i><em>小枝</em></span>
      <span class="tick" id="tick1"><i></i><em>細薪</em></span>
      <span class="tick" id="tick2"><i></i><em>太薪</em></span>
    </div>
  </div>
  <div class="frow">
    <span class="fl">熾火</span>
    <div id="egauge"><b id="efill"></b></div>
  </div>
</div>

<div id="guide">
  <span class="gstep" id="gstep"></span>
  <span class="gtext" id="gtext"></span>
</div>

<div id="topbar">
  <span id="clock">00:00</span>
  <button id="sndbtn">音</button>
  <button id="helpbtn">？</button>
</div>

<div id="help">
  <h2>遊び方</h2>
  <div class="rows">
    <div class="row"><span class="k">こする・タップ</span><span class="v">火花を散らして着火ゲージをためる／火をつついて火の粉を舞わせる</span></div>
    <div class="row"><span class="k">「扇ぐ」（Space・F）</span><span class="v">団扇でひと扇ぎ。連打するほど風が起きて火力が上がる</span></div>
    <div class="row"><span class="k">薪ボタン（1・2・3）</span><span class="v">薪をくべる。火力ゲージの目盛りを超えていれば燃える</span></div>
    <div class="row"><span class="k">火力が足りないと</span><span class="v">薪は燃えずに火が沈む。でも大丈夫、扇げば立て直せる</span></div>
    <div class="row"><span class="k">熾火ゲージ</span><span class="v">火力が高いあいだだけ育つ。育ちきれば火は消えなくなり、あとは、ただ眺めるだけ</span></div>
  </div>
  <div class="close">— 画面にふれて とじる —</div>
  <div class="credit">音源提供：Springin&#39; Sound Stock</div>
</div>

<div id="woodbar">
  <button class="wood" data-i="0"><span class="bars"><i></i></span>小枝<span class="need">すぐ着く</span></button>
  <button class="wood" data-i="1"><span class="bars"><i></i><i></i></span>細薪<span class="need">火力・中</span></button>
  <button class="wood" data-i="2"><span class="bars"><i></i><i></i><i></i></span>太薪<span class="need">火力・大</span></button>
  <button id="fanbtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2 C6.2 2 3 6.3 3 9.8 c0 3 2.6 5.2 5.6 5.2 h6.8 c3 0 5.6-2.2 5.6-5.2 C21 6.3 17.8 2 12 2 Z"/>
      <line x1="12" y1="15" x2="12" y2="21.5"/>
    </svg>
    扇ぐ<span class="fs">れんだ</span>
  </button>
</div>

<script>
'use strict';

/* =========================================================================
 *  焚き火 — takibi-ignite
 *  設計: takibi-design.md
 *    LAYER 1 … 炎本体（ParticleFlame / SpriteFlame、env契約で差し替え可能）
 *    LAYER 2 … 反応レイヤー（火の粉・煙・熾火・地明かり・薪・音・ビネット）
 * ========================================================================= */

/* ---------------- CONFIG（調整つまみ） ---------------- */
const CONFIG = {
  flameSource : 'illust',        // 'illust' | 'sprite' | 'particle'（未ロード時は自動でparticleへ）
  illustSrc   : 'assets/fire.png',    // 焚き火イラスト（透過PNG・薪＋炎の一枚絵）
  fireLoopSrc : 'assets/loop1.mp3',   // 焚き火環境音ループ（Springin' Sound Stock）
  igniteWork  : 9000,            // 着火に必要なこすり量（px相当・ブレあり。体感10秒前後）
  igniteDecay : 0.045,           // 手を止めたときの着火ゲージ減衰（割合/秒）
  tinderBurnSec  : 32,           // 火口が燃え尽きるまでの秒（扇ぐと早く減る）
  // need は前段の settle より高い＝扇いで押し上げないと次に進めない
  adds : [
    { id:'twig',  label:'小枝', need:0.10, settle:0.30, ember:0.06, burnSec:16 },
    { id:'thin',  label:'細薪', need:0.46, settle:0.58, ember:0.16, burnSec:28 },
    { id:'thick', label:'太薪', need:0.82, settle:1.00, ember:0.34, burnSec:55 },
  ],
  emberHotFloor : 0.45,          // この火力未満では熾火が育たない
  rewardEmber : 0.50,            // このemberで「ご褒美モード」へ
  rewardSettle: 0.85,            // ご褒美モードの火力フロア
  fireScale   : 1.4,             // 焚き火全体の大きさ（炎・薪・石組み・地明かり）
  emitRate    : 115,             // 炎パーティクル生成率
  maxParticles: 520,
  swayAmp     : 1.0,             // 風によるしなり
};

/* ---------------- imapp 連携（EMBED-CONTRACT §1〜§3・game-key: takibi） ----------------
 * 正本: games-imapp-shop/docs/EMBED-CONTRACT.md
 * 起動URL: ?embed=1&imapp=1&player=<uid>&hostOrigin=https://imapp.shop
 * ラウンド定義: 点火 → 熾火到達（game_over は熾火到達で1回） */
const IMAPP = (() => {
  const q = new URLSearchParams(location.search);
  const hostOrigin = q.get('hostOrigin');
  const active = (q.get('embed') === '1' || q.get('imapp') === '1')
                 && !!hostOrigin && window.parent !== window;
  let player = q.get('player') || null;
  function send(type, payload){
    if (!active) return;
    const msg = { source: 'takibi', type };
    if (payload !== undefined) msg.payload = payload;
    try { window.parent.postMessage(msg, hostOrigin); } catch (e) { /* noop */ }
  }
  if (active) {
    window.addEventListener('message', (ev) => {
      if (ev.origin !== hostOrigin) return;               // §3: origin検証
      const d = ev.data;
      if (!d || d.source !== 'imappt') return;            // §3: source検証
      if (d.type === 'config') {
        if (d.payload && typeof d.payload.player === 'string') player = d.payload.player;
        send('config_ack', { player });
      }
    });
  }
  return { send, get player(){ return player; } };
})();

/* ---------------- 基本 ---------------- */
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (REDUCE) { CONFIG.emitRate = Math.round(CONFIG.emitRate * 0.5); CONFIG.maxParticles = 240; }
const FS = CONFIG.fireScale;   // 焚き火の寸法系はすべてこれを掛ける

let W = 0, H = 0, DPR = 1, S = 1, cx = 0, baseY = 0;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W, H) / 780;
  cx = W / 2;
  baseY = H * 0.68;   // 下1/3はUIゾーンとして空ける
  buildScenery();
}
window.addEventListener('resize', resize);

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const fract = x => x - Math.floor(x);
const hash  = n => fract(Math.sin(n * 127.1) * 43758.5453);
const lerp  = (a, b, k) => a + (b - a) * k;

/* ---------------- スプライト（発光素材の事前描画） ---------------- */
function makeGlow(size, inner, outer){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0, inner);
  grad.addColorStop(0.4, outer);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  return c;
}
const SPR_CORE   = makeGlow(96, 'rgba(255,250,225,1)',  'rgba(255,220,130,0.55)');
const SPR_YELLOW = makeGlow(96, 'rgba(255,214,105,0.95)','rgba(255,150,40,0.45)');
const SPR_ORANGE = makeGlow(96, 'rgba(255,138,32,0.9)', 'rgba(235,70,12,0.35)');
const SPR_RED    = makeGlow(96, 'rgba(224,62,12,0.8)',  'rgba(120,16,2,0.25)');
const SPR_FLAME  = [SPR_CORE, SPR_YELLOW, SPR_ORANGE, SPR_RED];
const SPR_SPARK  = makeGlow(32, 'rgba(255,240,200,1)',  'rgba(255,150,50,0.6)');
const SPR_SMOKE  = makeGlow(96, 'rgba(150,150,158,0.5)','rgba(110,110,120,0.22)');
const SPR_LIGHT  = makeGlow(256,'rgba(255,160,60,0.55)','rgba(255,110,30,0.2)');

/* =========================================================================
 *  LAYER 1 ── 炎本体
 *  env = { ctx, cx, baseY, W, H, t, dt, power, heat, wind, reduce }
 * ========================================================================= */

class ParticleFlame {
  constructor(){ this.ps = []; this.acc = 0; }
  update(env){
    const { dt, power, wind } = env;
    if (power > 0.015) {
      // イラスト表示中は動きのアクセントだけに減量
      this.acc += CONFIG.emitRate * (0.2 + power) * dt * (env.illust ? 0.28 : 1);
      let n = Math.floor(this.acc);
      this.acc -= n;
      while (n-- > 0 && this.ps.length < CONFIG.maxParticles) {
        const spread = (14 + 60 * power) * S * FS;
        const r = (Math.random() * 2 - 1);
        this.ps.push({
          x: env.cx + r * spread * (0.4 + 0.6 * Math.abs(r)),
          y: env.baseY + (Math.random() * 8 - 6) * S,
          vx: r * 14 * S * FS,
          vy: -(55 + 190 * power) * (0.65 + Math.random() * 0.7) * S * FS,
          age: 0,
          life: (0.45 + Math.random() * 0.65) * (0.55 + power * 0.7),
          size: (9 + Math.random() * 17) * (0.45 + power * 0.75) * S * FS,
          seed: Math.random() * 100,
        });
      }
    }
    const t = env.t;
    for (let i = this.ps.length - 1; i >= 0; i--) {
      const p = this.ps[i];
      p.age += dt;
      if (p.age >= p.life) { this.ps[i] = this.ps[this.ps.length-1]; this.ps.pop(); continue; }
      const f = p.age / p.life;
      p.vy -= 60 * S * FS * dt;                                // 上昇加速
      p.x += (p.vx + (wind * 90 * CONFIG.swayAmp + Math.sin(t * 4 + p.seed) * 20) * f * S) * dt;
      p.x += (env.cx - p.x) * 2.4 * f * dt;                    // 先細り（収束）
      p.y += p.vy * dt;
    }
  }
  render(env){
    const { ctx, power, t } = env;
    if (power <= 0.015 && this.ps.length === 0) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // ベースの光芯
    const flick = 0.85 + 0.15 * Math.sin(t * 17) * Math.sin(t * 7.3);
    if (power > 0.02 && !env.illust) {   // 光芯はイラスト側が持つので省略
      const cw = (70 + 190 * power) * S * FS * flick;
      ctx.globalAlpha = 0.55 * clamp(power * 1.4, 0, 1);
      ctx.drawImage(SPR_YELLOW, env.cx - cw/2, env.baseY - cw * 0.62, cw, cw * 0.75);
      const cc = cw * 0.5;
      ctx.globalAlpha = 0.6 * clamp(power * 1.2, 0, 1);
      ctx.drawImage(SPR_CORE, env.cx - cc/2, env.baseY - cc * 0.55, cc, cc * 0.7);
    }
    // パーティクル
    for (let i = 0; i < this.ps.length; i++) {
      const p = this.ps[i];
      const f = p.age / p.life;
      const spr = f < 0.22 ? SPR_CORE : f < 0.5 ? SPR_YELLOW : f < 0.78 ? SPR_ORANGE : SPR_RED;
      const sz = p.size * (1.15 - f * 0.8);
      ctx.globalAlpha = Math.pow(1 - f, 1.4) * 0.85;
      ctx.drawImage(spr, p.x - sz/2, p.y - sz/2, sz, sz);
    }
    ctx.restore();
  }
}

/* SpriteFlame ── 実写／Blender／EmberGen 連番の受け皿（スタブ）
 * flameSprite.loadSheet('full', 'assets/fire_full.png', 8, 8, 24);
 * CONFIG.flameSource = 'sprite';  素材未用意なら自動でパーティクルへフォールバック */
class SpriteFlame {
  constructor(){ this.sheets = {}; }
  loadSheet(key, url, cols, rows, fps){
    const img = new Image();
    const s = { img, cols, rows, fps: fps || 24, frames: cols * rows, ok: false };
    img.onload  = () => { s.ok = true; };
    img.onerror = () => { s.ok = false; };
    img.src = url;
    this.sheets[key] = s;
  }
  pick(heat){
    const order = heat < 0.35 ? ['small','mid','full'] : heat < 0.7 ? ['mid','full','small'] : ['full','mid','small'];
    for (const k of order) { const s = this.sheets[k]; if (s && s.ok) return s; }
    return null;
  }
  render(env){
    const s = this.pick(env.heat);
    if (!s) return false;
    const fi = Math.floor(env.t * s.fps) % s.frames;
    const fw = s.img.width / s.cols, fh = s.img.height / s.rows;
    const sx = (fi % s.cols) * fw, sy = Math.floor(fi / s.cols) * fh;
    const scale = (0.3 + env.power * 0.9) * S * FS * 420 / fh;
    const dw = fw * scale, dh = fh * scale;
    env.ctx.save();
    env.ctx.globalCompositeOperation = 'lighter';   // 黒背景素材は加算で自動的に抜ける
    env.ctx.globalAlpha = clamp(env.power * 1.6, 0, 1);
    env.ctx.translate(env.cx + env.wind * 26 * S, env.baseY);
    env.ctx.transform(1, 0, env.wind * 0.22 * CONFIG.swayAmp, 1, 0, 0);  // 風でしなる
    env.ctx.drawImage(s.img, sx, sy, fw, fh, -dw/2, -dh, dw, dh);
    env.ctx.restore();
    return true;
  }
}
/* IllustFire ── 焚き火イラスト（薪＋炎の一枚絵・透過PNG）を火力で立ち上げるレイヤー
 * 炎は薪の上から「育つ」：火力に応じて見せる範囲を上へ広げ、未点火時は暗色シルエット。
 * ゆらぎ・熾火の脈動・照り返しを演出し、動きはパーティクル(減量)を上に重ねて補う */
class IllustFire {
  constructor(src){
    this.ready = false;
    this.off = document.createElement('canvas');
    this.LOG_TOP = 0.60;   // 画像内で薪が始まる高さ（上からの比率）
    this.img = new Image();
    this.img.onload = () => {
      // 未点火用の暗色シルエットを事前生成
      const c = document.createElement('canvas');
      c.width = this.img.width; c.height = this.img.height;
      const g = c.getContext('2d');
      g.drawImage(this.img, 0, 0);
      g.globalCompositeOperation = 'source-atop';
      g.fillStyle = 'rgba(9,7,8,0.93)';
      g.fillRect(0, 0, c.width, c.height);
      this.dark = c;
      this.ready = true;
    };
    this.img.onerror = () => { this.ready = false; };
    this.img.src = src;
  }
  render(env){
    if (!this.ready) return false;
    const { ctx, t } = env;
    const iw = this.img.width, ih = this.img.height;
    const powerN = clamp(env.power / 1.15, 0, 1);
    const lit = clamp(env.heat * 2.2 + game.ember * 0.4, 0, 1);
    const dw = 230 * S * FS * (0.94 + 0.12 * powerN);
    // 火力で見せる範囲を上へ（炎が薪から育って見える）
    const cut = this.LOG_TOP * (1 - Math.pow(powerN, 0.8));
    const sy = cut * ih, sh = ih - sy;
    const ow = Math.max(2, Math.ceil(dw)), oh = Math.max(2, Math.ceil(dw * (sh / ih)));
    const o = this.off;
    if (o.width !== ow || o.height !== oh) { o.width = ow; o.height = oh; }
    const og = o.getContext('2d');
    og.clearRect(0, 0, ow, oh);
    og.drawImage(this.img, 0, sy, iw, sh, 0, 0, ow, oh);
    if (lit < 1) {                       // 未点火〜低火力は暗色版をかぶせる
      og.globalAlpha = 1 - lit;
      og.drawImage(this.dark, 0, sy, iw, sh, 0, 0, ow, oh);
      og.globalAlpha = 1;
    }
    if (cut > 0.02) {                    // 見せ始めの上端をやわらかく消す
      og.globalCompositeOperation = 'destination-out';
      const fade = og.createLinearGradient(0, 0, 0, oh * 0.16);
      fade.addColorStop(0, 'rgba(0,0,0,1)');
      fade.addColorStop(1, 'rgba(0,0,0,0)');
      og.fillStyle = fade;
      og.fillRect(0, 0, ow, oh * 0.16);
      og.globalCompositeOperation = 'source-over';
    }
    // ゆらぎ（縦の伸縮）と風のしなり
    const wob = 1 + (0.016 * Math.sin(t * 7.1) + 0.010 * Math.sin(t * 12.7)) * (0.3 + powerN);
    const skew = env.wind * 0.05 * (0.3 + powerN) * CONFIG.swayAmp;
    ctx.save();
    ctx.translate(env.cx, env.baseY + 34 * S);
    ctx.transform(1, 0, skew, 1, 0, 0);
    ctx.scale(1, wob);
    ctx.drawImage(o, -ow / 2, -oh, ow, oh);
    if (game.ember > 0.03 || env.heat > 0.1) {
      const fl = 0.5 + 0.5 * Math.sin(t * 5.3) * Math.sin(t * 2.1);
      ctx.globalCompositeOperation = 'lighter';
      // 熾火の脈動（下部だけ加算でひと呼吸）
      ctx.globalAlpha = (game.ember * 0.22 + env.heat * 0.08) * (0.6 + 0.4 * fl);
      const eh = oh * 0.34;
      ctx.drawImage(o, 0, oh - eh, ow, eh, -ow / 2, -eh, ow, eh);
      // 炎の照り返し（全体をうっすら加算でちらつかせる）
      if (powerN > 0.15) {
        ctx.globalAlpha = Math.max(0, 0.06 + 0.05 * Math.sin(t * 11) * Math.sin(t * 4.7)) * powerN;
        ctx.drawImage(o, -ow / 2, -oh, ow, oh);
      }
    }
    ctx.restore();
    return true;
  }
}

const sparks = [];
function sparkBurst(x, y, n, speed){
  for (let i = 0; i < n; i++) {
    const a = -Math.PI/2 + (Math.random()*2 - 1) * 1.15;
    const v = (speed || 120) * (0.35 + Math.random()) * S;
    sparks.push({
      x: x + (Math.random()*2-1) * 14 * S * FS, y,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      age: 0, life: 0.7 + Math.random() * 1.7,
      size: (1.6 + Math.random() * 2.4) * S * Math.sqrt(FS), seed: Math.random() * 100,
    });
  }
}
function updateSparks(env){
  const { dt, wind, t } = env;
  // 火が強いほど自然に火の粉が舞う
  if (env.heat > 0.12 && Math.random() < env.heat * (blowStr > 0.35 ? 2.2 : 0.9) * dt * 22) {
    sparkBurst(env.cx, env.baseY - 20 * S, 1, 90 + env.heat * 130);
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.age += dt;
    if (p.age >= p.life || p.y < -20) { sparks[i] = sparks[sparks.length-1]; sparks.pop(); continue; }
    p.vy -= 26 * S * dt;
    p.vx += (wind * 55 + Math.sin(t * 6 + p.seed) * 30) * S * dt;
    p.vx *= (1 - 0.6 * dt);
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function renderSparks(env){
  const { ctx, t } = env;
  if (!sparks.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of sparks) {
    const f = p.age / p.life;
    const tw = 0.55 + 0.45 * Math.sin(t * 22 + p.seed * 9);
    ctx.globalAlpha = (1 - f) * tw;
    const sz = p.size * (2.6 - f * 1.4);
    ctx.drawImage(SPR_SPARK, p.x - sz/2, p.y - sz/2, sz, sz);
  }
  ctx.restore();
}

const smokes = [];
function smokePuff(x, y, n, big){
  for (let i = 0; i < n; i++) {
    smokes.push({
      x: x + (Math.random()*2-1) * 20 * S, y,
      vy: -(22 + Math.random() * 26) * S,
      age: 0, life: 2.4 + Math.random() * 2.8,
      size: (big ? 34 : 20) * (0.7 + Math.random() * 0.8) * S * FS,
      seed: Math.random() * 100, a: big ? 0.30 : 0.16,
    });
  }
}
function updateSmoke(env){
  const { dt, wind, t } = env;
  // くすぶり：熾火だけ・弱火のときに立ちのぼる
  const smolder = (env.heat < 0.25 && game.ember > 0.05) || game.pending.length > 0
                || (game.phase === 'dark' && game.ignite > 0.6);
  if (smolder && Math.random() < dt * 6) smokePuff(env.cx, env.baseY - 8 * S, 1, false);
  if (env.heat > 0.4 && Math.random() < dt * 2) smokePuff(env.cx, env.baseY - 40 * S, 1, false);
  for (let i = smokes.length - 1; i >= 0; i--) {
    const p = smokes[i];
    p.age += dt;
    if (p.age >= p.life) { smokes[i] = smokes[smokes.length-1]; smokes.pop(); continue; }
    p.y += p.vy * dt;
    p.x += (wind * 70 + Math.sin(t * 1.5 + p.seed) * 16) * S * dt;
  }
}
function renderSmoke(env){
  const { ctx } = env;
  if (!smokes.length) return;
  ctx.save();
  for (const p of smokes) {
    const f = p.age / p.life;
    ctx.globalAlpha = p.a * Math.sin(Math.PI * f);
    const sz = p.size * (1 + f * 2.6);
    ctx.drawImage(SPR_SMOKE, p.x - sz/2, p.y - sz/2, sz, sz);
  }
  ctx.restore();
}

/* ---- 薪（見た目） ---- */
const visualLogs = [];
function initLogPile(){
  visualLogs.length = 0;
  visualLogs.push({ rot: 0.06, len: 130, th: 14, off: 0,  lift: 4,  kind: 'base', lit: 0 });
  visualLogs.push({ rot: -0.1, len: 118, th: 13, off: 6,  lift: 9,  kind: 'base', lit: 0 });
}
function addVisualLog(i){
  const TH = [6, 10, 16][i], LN = [80, 105, 135][i];
  visualLogs.push({
    rot: (Math.random()*2-1) * 0.5 + (Math.random() < 0.5 ? 0.3 : -0.3),
    len: LN * (0.85 + Math.random()*0.3),
    th: TH, off: (Math.random()*2-1) * 18,
    lift: 10 + visualLogs.length * 2.4 + Math.random()*6,
    kind: i, lit: 0,
  });
  if (visualLogs.length > 9) visualLogs.splice(2, 1); // 土台2本は残す
}
function renderLogs(env){
  const { ctx, t } = env;
  const glow = clamp(game.ember * 0.85 + env.heat * 0.35, 0, 1);
  for (const L of visualLogs) {
    ctx.save();
    ctx.translate(env.cx + L.off * S * FS, env.baseY + (6 - L.lift * 0.55) * S * FS);
    ctx.rotate(L.rot);
    const w = L.len * S * FS, h = L.th * S * FS;
    // 本体
    const g = ctx.createLinearGradient(0, -h/2, 0, h/2);
    g.addColorStop(0, '#241812');
    g.addColorStop(0.5, '#170f0a');
    g.addColorStop(1, '#0b0705');
    ctx.fillStyle = g;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-w/2, -h/2, w, h, h/2); else ctx.rect(-w/2, -h/2, w, h);
    ctx.fill();
    // 火に照らされる面
    if (glow > 0.02) {
      const fl = 0.75 + 0.25 * Math.sin(t * 9 + L.off);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = glow * 0.5 * fl;
      const gg = ctx.createLinearGradient(0, -h/2, 0, h/2);
      gg.addColorStop(0, 'rgba(255,120,30,0.55)');
      gg.addColorStop(1, 'rgba(255,60,10,0.05)');
      ctx.fillStyle = gg;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-w/2, -h/2, w, h, h/2); else ctx.rect(-w/2, -h/2, w, h);
      ctx.fill();
      // 熾火の割れ目
      ctx.globalAlpha = glow * (0.35 + 0.3 * Math.sin(t * 5 + L.off * 3));
      ctx.strokeStyle = '#ff9a30';
      ctx.lineWidth = Math.max(1, h * 0.14);
      ctx.beginPath();
      ctx.moveTo(-w * 0.28, 0); ctx.lineTo(-w * 0.12, h * 0.12);
      ctx.moveTo(w * 0.08, -h * 0.1); ctx.lineTo(w * 0.26, h * 0.06);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function renderGroundLight(env){

/* ---- 夜のシーン ---- */
let stars = [], mount1 = [], mount2 = [], trees = [], flies = [];
function buildScenery(){
  stars = [];
  const n = REDUCE ? 70 : 150;
  for (let i = 0; i < n; i++) {
    stars.push({
      x: hash(i * 1.7) * W, y: hash(i * 3.1) * H * 0.55,
      r: 0.4 + hash(i * 5.3) * 1.3,
      ph: hash(i * 7.7) * 6.28, sp: 0.4 + hash(i * 9.1) * 1.6,
    });
  }
  mount1 = []; mount2 = [];
  const step = 46;
  for (let x = -step; x <= W + step; x += step) {
    const i = Math.round(x / step);
    mount1.push([x, H * 0.60 + (hash(i * 2.3) + hash(i * 0.7 + 9)) * H * 0.055]);
    mount2.push([x, H * 0.66 + (hash(i * 4.1 + 3) + hash(i * 1.3 + 5)) * H * 0.045]);
  }
  trees = [];
  const tn = Math.max(3, Math.floor(W / 260));
  for (let i = 0; i < tn; i++) {
    const side = i % 2 === 0 ? 1 : -1;
    const fx = 0.5 + side * (0.26 + hash(i * 11.3) * 0.24);
    trees.push({ x: clamp(fx, 0.04, 0.96) * W, h: (90 + hash(i * 13.7) * 90) * S });
  }
  flies = [];
  for (let i = 0; i < 9; i++) {
    flies.push({ sx: hash(i*17.3), sy: hash(i*19.1), ph: hash(i*23.7)*6.28, sp: 0.5 + hash(i*29.3) });
  }
}
let shoot = null, shootTimer = 18;

function renderScene(env){
  const { ctx, t } = env;
  const warm = clamp(env.power * 0.5 + game.ember * 0.2, 0, 0.6);
  // 空
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#04050f');
  sky.addColorStop(0.55, `rgb(${10 + warm*22|0},${11 + warm*10|0},${28})`);
  sky.addColorStop(1, `rgb(${16 + warm*46|0},${12 + warm*20|0},${18})`);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);
  // 星
  ctx.save();
  for (const s of stars) {
    const a = (0.25 + 0.75 * Math.pow(Math.sin(t * s.sp + s.ph) * 0.5 + 0.5, 2)) * 0.8;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#dfe6ff';
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.restore();
  // 流れ星
  if (shoot) {
    shoot.age += env.dt;
    if (shoot.age > 0.9) shoot = null;
    else {
      const f = shoot.age / 0.9;
      const x = shoot.x + f * shoot.vx, y = shoot.y + f * shoot.vy;
      ctx.save();
      ctx.globalAlpha = Math.sin(Math.PI * f) * 0.9;
      const g = ctx.createLinearGradient(x, y, x - shoot.vx * 0.14, y - shoot.vy * 0.14);
      g.addColorStop(0, 'rgba(230,240,255,0.95)');
      g.addColorStop(1, 'rgba(230,240,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - shoot.vx * 0.14, y - shoot.vy * 0.14); ctx.stroke();
      ctx.restore();
    }
  } else if (game.reward && !REDUCE) {
    shootTimer -= env.dt;
    if (shootTimer <= 0) {
      shootTimer = 16 + Math.random() * 26;
      shoot = { x: W * (0.15 + Math.random() * 0.7), y: H * (0.06 + Math.random() * 0.2),
                vx: (Math.random() < 0.5 ? -1 : 1) * (220 + Math.random() * 200), vy: 90 + Math.random() * 80, age: 0 };
    }
  }
  // 月
  const mx = W * 0.80, my = H * 0.16, mr = 26 * S;
  ctx.save();
  ctx.globalAlpha = 0.5;
  const mg = ctx.createRadialGradient(mx, my, mr * 0.4, mx, my, mr * 4);
  mg.addColorStop(0, 'rgba(210,220,240,0.5)');
  mg.addColorStop(1, 'rgba(210,220,240,0)');
  ctx.fillStyle = mg;
  ctx.fillRect(mx - mr*4, my - mr*4, mr*8, mr*8);
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = '#dfe4ee';
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#0a0c1c';
  ctx.globalAlpha = 0.92;
  ctx.beginPath(); ctx.arc(mx - mr * 0.42, my - mr * 0.18, mr * 0.92, 0, 6.284); ctx.fill();
  ctx.restore();
  // 山（2層）
  drawRidge(mount1, '#0a0d18');
  drawRidge(mount2, '#070912');
  // 針葉樹
  ctx.fillStyle = '#05070d';
  for (const tr of trees) drawConifer(ctx, tr.x, H * 0.735, tr.h);
  // 地面
  const gg = ctx.createLinearGradient(0, baseY - 40, 0, H);
  gg.addColorStop(0, '#0b0a0c');
  gg.addColorStop(1, '#040305');
  ctx.fillStyle = gg;
  ctx.fillRect(0, baseY - 8 * S, W, H - baseY + 8 * S);
  // 焚き火の周りの石
  ctx.fillStyle = '#1a1614';
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI + Math.PI * 0.02 * (i % 3);
    const rx = cx + Math.cos(a) * 105 * S * FS * (1 + hash(i*3.3) * 0.14);
    const ry = baseY + 16 * S + Math.sin(a) * 26 * S * 0.4 + hash(i*5.9) * 5 * S;
    const rr = (9 + hash(i * 7.1) * 7) * S * FS;
    ctx.beginPath(); ctx.ellipse(rx, ry, rr, rr * 0.62, 0, 0, 6.284); ctx.fill();
  }
}
function drawRidge(pts, col){
  if (!pts.length) return;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.lineTo(W + 50, H); ctx.lineTo(-50, H);
  ctx.closePath(); ctx.fill();
}
function drawConifer(c, x, gy, h){
  const w = h * 0.42;
  for (let k = 0; k < 3; k++) {
    const yy = gy - h * (0.30 + k * 0.26);
    const ww = w * (1 - k * 0.26);
    c.beginPath();
    c.moveTo(x, yy - h * 0.34);
    c.lineTo(x - ww / 2, yy);
    c.lineTo(x + ww / 2, yy);
    c.closePath(); c.fill();
  }
  c.fillRect(x - h * 0.03, gy - h * 0.3, h * 0.06, h * 0.3);
}
function renderFireflies(env){
  if (!game.reward || REDUCE) return;
  const { ctx, t } = env;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const f of flies) {
    const x = (f.sx * 0.9 + 0.05) * W + Math.sin(t * 0.23 * f.sp + f.ph) * 70 * S + Math.sin(t * 0.7 * f.sp) * 24 * S;
    const y = H * (0.42 + f.sy * 0.28) + Math.sin(t * 0.31 * f.sp + f.ph * 2) * 46 * S;
    const blink = Math.pow(Math.max(0, Math.sin(t * (0.8 + f.sp * 0.5) + f.ph * 3)), 6);
    if (blink < 0.03) continue;
    ctx.globalAlpha = blink * 0.8;
    ctx.fillStyle = '#d8ffa0';
    ctx.beginPath(); ctx.arc(x, y, 1.6 * S, 0, 6.284); ctx.fill();
    ctx.globalAlpha = blink * 0.25;
    ctx.beginPath(); ctx.arc(x, y, 5 * S, 0, 6.284); ctx.fill();
  }
  ctx.restore();
}
/* ---- 着火ゲージ（火おこし中だけ、薪の下に出る） ---- */
function renderIgnite(env){
  if (game.phase !== 'dark') return;
  const { ctx, t } = env;
  // 「ついたか？」の疑似着火ゆらめき
  if (almostT > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = almostT * (0.45 + 0.55 * Math.abs(Math.sin(t * 34)));
    const sz = 48 * S * FS;
    ctx.drawImage(SPR_YELLOW, cx - sz / 2, baseY - 22 * S - sz * 0.55, sz, sz);
    ctx.restore();
  }
  if (game.ignite <= 0.004) return;
  const w = 156 * S * FS, x = cx - w / 2, y = baseY + 52 * S;
  // 満タン近くはゲージ自体が震える（つくかな？の緊張）
  const near = game.ignite > 0.6;
  const wob = near ? Math.sin(t * 26) * 0.02 + Math.sin(t * 7.3) * 0.015 : 0;
  const v = clamp(game.ignite + wob, 0, 1);
  ctx.save();
  ctx.lineCap = 'round';
  ctx.globalAlpha = 0.8;
  ctx.strokeStyle = 'rgba(232,220,200,0.22)';
  ctx.lineWidth = 4.5 * S;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.stroke();
  const grad = ctx.createLinearGradient(x, 0, x + w, 0);
  grad.addColorStop(0, '#8c2f0a'); grad.addColorStop(0.7, '#ff7a1a'); grad.addColorStop(1, '#ffd062');
  ctx.strokeStyle = grad;
  ctx.globalAlpha = 0.95;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w * v, y); ctx.stroke();
  ctx.globalAlpha = 0.55 + (near ? 0.25 * Math.sin(t * 8) : 0);
  ctx.fillStyle = '#e8dcc8';
  ctx.font = Math.round(11 * S + 2) + 'px serif';
  ctx.textAlign = 'center';
  ctx.fillText('着火', cx, y + 20 * S);
  ctx.restore();
}

/* ---- ガイドのジェスチャー表示（こする動き） ---- */
function renderGuide(env){
  if (!guide.step) return;
  const { ctx, t } = env;
  if (guide.step === 'strike' && game.ignite < 0.2) {
    // 薪の上を左右に動く光点 ＝「ここをこする」
    const y = baseY - 34 * S;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 4; k++) {
      const xt = cx + Math.sin((t - k * 0.06) * 2.4) * 74 * S * FS;
      ctx.globalAlpha = 0.55 * (1 - k / 4);
      const sz = (15 - k * 2.6) * S;
      ctx.drawImage(SPR_SPARK, xt - sz/2, y - sz/2, sz, sz);
    }
    // 両端の山括弧（往復を示す）
    ctx.globalAlpha = 0.3 + 0.2 * Math.sin(t * 3);
    ctx.strokeStyle = '#e8dcc8';
    ctx.lineWidth = 1.4;
    const ax = 96 * S * FS;
    ctx.beginPath();
    ctx.moveTo(cx - ax + 8*S, y - 5*S); ctx.lineTo(cx - ax, y); ctx.lineTo(cx - ax + 8*S, y + 5*S);
    ctx.moveTo(cx + ax - 8*S, y - 5*S); ctx.lineTo(cx + ax, y); ctx.lineTo(cx + ax - 8*S, y + 5*S);
    ctx.stroke();
    ctx.restore();
  }
  // 手順二（扇ぐ）はボタン自体の点滅で誘導する
}

function renderVignette(env){
  const { ctx } = env;
  const g = ctx.createRadialGradient(cx, H * 0.55, Math.min(W, H) * 0.32, cx, H * 0.55, Math.max(W, H) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.62)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================================
 *  音（Web Audio ── 全て生成音）
 * ========================================================================= */
const AudioSys = (() => {
  let ac = null, master = null, noiseBuf = null;
  let fireGain = null, blowGain = null;
  let loopGain = null, loopEl = null, loopMode = null;   // 実録の焚き火ループ
  let muted = localStorage.getItem('takibi-mute') === '1';

  // 実録ループ: WebAudioで読み、file://等でfetch不可なら<audio>で代替
  function initLoop(){
    if (loopMode) return;
    loopMode = 'pending';
    fetch(CONFIG.fireLoopSrc)
      .then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
      .then(ab => ac.decodeAudioData(ab))
      .then(buf => {
        const s = ac.createBufferSource();
        s.buffer = buf; s.loop = true;
        loopGain = ac.createGain(); loopGain.gain.value = 0;
        s.connect(loopGain); loopGain.connect(master);
        s.start();
        loopMode = 'webaudio';
      })
      .catch(() => {
        try {
          loopEl = new Audio(CONFIG.fireLoopSrc);
          loopEl.loop = true; loopEl.volume = 0;
          loopEl.play().then(() => { loopMode = 'element'; })
                       .catch(() => { loopMode = 'none'; });
        } catch (e) { loopMode = 'none'; }
      });
  }

  function makeNoise(sec){
    const b = ac.createBuffer(1, Math.floor(ac.sampleRate * sec), ac.sampleRate);
    const d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      d[i] = last * 3.2 + w * 0.32;
    }
    return b;
  }
  function ensure(){
    if (ac) { if (ac.state === 'suspended') ac.resume(); return true; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; }
    master = ac.createGain();
    master.gain.value = muted ? 0 : 1;
    master.connect(ac.destination);
    noiseBuf = makeNoise(2.5);
    // 火の胴鳴り（ローパスノイズ）
    const fs = ac.createBufferSource();
    fs.buffer = noiseBuf; fs.loop = true;
    const ff = ac.createBiquadFilter(); ff.type = 'lowpass'; ff.frequency.value = 300;
    fireGain = ac.createGain(); fireGain.gain.value = 0;
    fs.connect(ff); ff.connect(fireGain); fireGain.connect(master);
    fs.start();
    // 息（バンドパスノイズ）
    const bs = ac.createBufferSource();
    bs.buffer = noiseBuf; bs.loop = true;
    const bf = ac.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = 650; bf.Q.value = 0.7;
    blowGain = ac.createGain(); blowGain.gain.value = 0;
    bs.connect(bf); bf.connect(blowGain); blowGain.connect(master);
    bs.start();
    initLoop();
    return true;
  }
  function pop(freq, dur, vol, type){
    if (!ac || muted) return;
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    src.playbackRate.value = 0.8 + Math.random() * 0.5;
    const f = ac.createBiquadFilter();
    f.type = type || 'bandpass';
    f.frequency.value = freq;
    f.Q.value = 4 + Math.random() * 8;
    const g = ac.createGain();
    const t0 = ac.currentTime;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0, Math.random() * 1.5, dur + 0.06);
  }
  function update(dt, heat, blow){
    if (!ac || ac.state !== 'running') return;
    const T = ac.currentTime + 0.05;
    const real = clamp(heat, 0, 1) * 0.85 + blow * 0.1;   // 実録ループの音量カーブ
    if (loopMode === 'webaudio') {
      loopGain.gain.linearRampToValueAtTime(real, T);
      fireGain.gain.linearRampToValueAtTime(0, T);        // 実音源があるとき合成の胴鳴りは止める
    } else {
      fireGain.gain.linearRampToValueAtTime(clamp(heat, 0, 1.1) * 0.11, T);
      if (loopMode === 'element' && loopEl) loopEl.volume = muted ? 0 : clamp(real, 0, 1);
    }
    blowGain.gain.linearRampToValueAtTime(blow * 0.22, T);
  }
  function strike(){
    pop(3200, 0.045, 0.5, 'highpass');
    pop(5200, 0.03, 0.3, 'highpass');
  }
  function whoosh(){
    pop(430 + Math.random() * 180, 0.3, 0.5, 'lowpass');
    pop(1000 + Math.random() * 300, 0.16, 0.16);
  }
  function crackle(heat){ pop(500 + Math.random() * 2800 * heat, 0.03 + Math.random() * 0.1, 0.06 + heat * 0.28 * Math.random()); }
  function flare(){ pop(900, 0.35, 0.4, 'lowpass'); pop(2400, 0.2, 0.25); }
  function hiss(){ pop(1600, 0.6, 0.3, 'bandpass'); }
  function toggle(){
    muted = !muted;
    localStorage.setItem('takibi-mute', muted ? '1' : '0');
    if (master) master.gain.value = muted ? 0 : 1;
    if (loopEl) loopEl.volume = 0;   // element経路は次のupdateで追従
    return !muted;
  }
  return { ensure, update, strike, whoosh, crackle, flare, hiss, toggle,
           get on(){ return !muted; },
           get hasRealLoop(){ return loopMode === 'webaudio' || loopMode === 'element'; } };
})();

const game = {
  phase: 'dark',        // 'dark' → 'tinder' → …ずっと世話 → reward=true
  ignite: 0,            // 着火ゲージ 0〜1（こすって溜める・放置で減る）
  notch: 0,             // 着火演出をどこまで出したか
  heat: 0,              // 生の火力 0〜約1.15
  ember: 0,             // 熾火 0〜1
  tinder: null,         // { remain }
  burning: [],          // [{ spec, remain, ramp }]
  pending: [],          // 火力不足で沈んだ薪 [{ spec, warm }]
  flare: 0,             // くべた瞬間の閃光
  reward: false,

  damped: 0,            // このラウンドで沈ませた回数（同上）
  crackleT: 0.4,
};
let fanPower = 0, blowStr = 0;          // 団扇: ひと扇ぎごとに fanPower が跳ね、自然減衰
let rubT = 9, fxAcc = 0, sndAcc = 0;    // 火おこし: こすり判定用
let almostT = 0;                        // 「ついたか？」の疑似着火ゆらめき
let elapsed = 0;

/* ---- ステップガイド（チュートリアル）----

const GUIDE = {

  blow:   { n: '手順 二', t: '「扇ぐ」ボタンを連打して、風を送ろう' },

};

/* ---- 薪をくべる ---- */
function feed(i){
  if (game.phase === 'dark' || cooldown[i] > 0) return;
  const spec = CONFIG.adds[i];
  cooldown[i] = 1.0;
  addVisualLog(i);
  game.logsFed++;
  if (game.heat >= spec.need) {
    // 着火：フレアと火の粉
    game.burning.push({ spec, remain: spec.burnSec, ramp: 0 });
    game.flare = Math.min(game.flare + 0.45 + spec.settle * 0.3, 1);
    sparkBurst(cx, baseY - 26 * S, 12 + i * 8, 150 + i * 60);
    AudioSys.flare();
  } else {
    // 火力不足：火が沈んで煙が出る（可逆・ゲームオーバーなし）
    game.damped++;
    game.heat = Math.max(0.02, game.heat - 0.1 - spec.settle * 0.1);
    game.pending.push({ spec, warm: 0 });
    smokePuff(cx, baseY - 14 * S, 7, true);
    AudioSys.hiss();
    say('火が沈んだ……。「扇ぐ」を連打して立て直そう', 5);
  }
}
woodBtns.forEach(btn => {
  btn.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    AudioSys.ensure();
    feed(parseInt(btn.dataset.i, 10));
  });
});

/* ---- 団扇（「扇ぐ」ボタン）：ひと扇ぎ＝ひと吹きの風。連打で勢いが増す ---- */
function fanSwing(){
  AudioSys.ensure();
  if (game.phase === 'dark') { say('まずは火花から。薪の上をこすろう', 3); return; }
  fanPower = Math.min(fanPower + 0.5, 1.4);
  AudioSys.whoosh();
  if (game.heat > 0.08) sparkBurst(cx, baseY - 22 * S, 4 + Math.round(game.heat * 8), 130 + game.heat * 130);
  if (guide.step === 'blow') guide.fans = (guide.fans || 0) + 1;
  // 団扇の振りアニメを毎回リスタート
  elFan.classList.remove('swing');
  void elFan.offsetWidth;
  elFan.classList.add('swing');
  showUI();
}
elFan.addEventListener('pointerdown', (e) => { e.stopPropagation(); fanSwing(); });

/* ---- 火おこし（こすって着火ゲージを溜める。放置で減る） ---- */
function inStrikeZone(x, y){
  const dx = x - cx, dy = y - (baseY - 20 * S);
  return dx * dx + dy * dy < Math.pow(Math.min(W, H) * 0.3, 2);
}
function addIgnite(px){
  rubT = 0;
  // こすり量→ゲージ。実りは毎回ブレる（つくかな？の手応え）
  const gain = (px / (CONFIG.igniteWork * S)) * (0.55 + Math.random() * 0.85);
  game.ignite = clamp(game.ignite + gain, 0, 1);
  // 火花と火打ち音（こすった距離に応じて）
  fxAcc += px; sndAcc += px;
  while (fxAcc > 55) {
    fxAcc -= 55;
    sparkBurst(cx + (Math.random() * 2 - 1) * 26 * S, baseY - 18 * S,
               2 + Math.round(game.ignite * 5), 80 + game.ignite * 150);
  }
  if (sndAcc > 130) { sndAcc = 0; AudioSys.strike(); }
  // 「つくかな？ まだかな？」の演出（ゲージ通過点で一度ずつ）
  const notches = [
    [0.35, () => say('火花が散る……いい調子', 3)],
    [0.62, () => { almostT = 0.5; smokePuff(cx, baseY - 14 * S, 3, false); say('……ついたか？　まだだ', 3); }],
    [0.80, () => { smokePuff(cx, baseY - 14 * S, 5, true); say('煙が出てきた。もう少し！', 3); }],
    [0.93, () => { almostT = 0.6; }],
  ];
  while (game.notch < notches.length && game.ignite >= notches[game.notch][0]) {
    notches[game.notch][1]();
    game.notch++;
  }
  if (game.ignite >= 1) igniteFire();
}
function igniteFire(){
  game.phase = 'tinder';
  game.tinder = { remain: CONFIG.tinderBurnSec };
  game.heat = 0.14;
  game.litAt = elapsed;
  game.logsFed = 0;
  game.damped = 0;
  game.ignite = 0;
  game.notch = 0;
  almostT = 0;
  IMAPP.send('game_start', {});
  elTitle.classList.add('hide');
  sparkBurst(cx, baseY - 20 * S, 30, 180);
  AudioSys.flare();
  say('ついた！', 3);
}

/* ---- ポインタ入力（こする＝火おこし、タップ＝つつく） ---- */
let pDown = false, pHold = 0, pMoved = 0, pLastX = 0, pLastY = 0;
cv.addEventListener('pointerdown', (e) => {
  AudioSys.ensure();
  pDown = true; pHold = 0; pMoved = 0;
  pLastX = e.clientX; pLastY = e.clientY;
  showUI();
});
cv.addEventListener('pointermove', (e) => {
  if (!pDown) return;
  const d = Math.hypot(e.clientX - pLastX, e.clientY - pLastY);
  pMoved += d;
  pLastX = e.clientX; pLastY = e.clientY;
  // 暗闇フェーズ：こすった分だけ着火ゲージが溜まる
  if (game.phase === 'dark' && d > 0 && inStrikeZone(e.clientX, e.clientY)) addIgnite(d);
});
function pointerUp(e){
  if (!pDown) return;
  pDown = false;
  if (game.phase === 'dark') {
    // タップでも少しだけ溜まる（こするほうが速い）
    if (pMoved < 24 && inStrikeZone(pLastX, pLastY)) addIgnite(160 + Math.random() * 120);
    return;
  }
  // 短いタップ＝火かき棒でつつく
  if (pHold < 0.25 && pMoved < 24 && game.heat > 0.05) {
    sparkBurst(cx, baseY - 24 * S, 16, 190);
    game.heat = Math.min(game.heat + 0.02, 1.15);
    AudioSys.crackle(0.8);
  }
}
cv.addEventListener('pointerup', pointerUp);
cv.addEventListener('pointercancel', pointerUp);
cv.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  AudioSys.ensure();
  if (e.code === 'Space') {
    e.preventDefault();
    if (game.phase === 'dark') addIgnite(180 + Math.random() * 120);
    else fanSwing();
  }
  if (e.code === 'KeyF' && game.phase !== 'dark') fanSwing();
  if (e.code === 'Digit1') feed(0);
  if (e.code === 'Digit2') feed(1);
  if (e.code === 'Digit3') feed(2);
});

/* ---- ご褒美モードのUI自動退避 ---- */
let uiIdle = 0;
function showUI(){ uiIdle = 0; }
window.addEventListener('pointermove', showUI, { passive: true });

/* =========================================================================
 *  更新
 * ========================================================================= */
function update(dt, t){
  elapsed += dt;

  if (pDown) pHold += dt;

  // 団扇の風：ひと扇ぎごとの突風がゆっくり減衰する
  fanPower = Math.max(0, fanPower - dt * 0.8);
  blowStr += (clamp(fanPower, 0, 1) * (game.heat > 0.02 ? 1 : 0) - blowStr) * 6 * dt;

  // 火おこしゲージ：手を止めると冷めていく（つくかな？の緊張）
  if (game.phase === 'dark') {
    rubT += dt;
    almostT = Math.max(0, almostT - dt);
    if (rubT > 0.4 && game.ignite > 0) {
      game.ignite = Math.max(0, game.ignite - CONFIG.igniteDecay * dt);
      // 冷めたら演出も巻き戻す（また「もう少し！」が出るように）
      const marks = [0.35, 0.62, 0.80, 0.93];
      while (game.notch > 0 && game.ignite < marks[game.notch - 1] - 0.12) game.notch--;
    }
  }

  // ---- 火力モデル ----
  let target = game.ember * 0.5;
  if (game.tinder) {
    // 扇ぐと火口の減りが早い＝火口のうちに扇ぎすぎない、という駆け引き
    game.tinder.remain -= dt * (1 + blowStr * 0.8);
    if (game.tinder.remain <= 0) game.tinder = null;
    else target = Math.max(target, 0.18 * clamp(game.tinder.remain / 6, 0, 1));
  }
  // 熾火は高火力のときだけ育つ（火を強く保つ理由になる）
  const hot = clamp((game.heat - CONFIG.emberHotFloor) / 0.4, 0, 1);
  for (let i = game.burning.length - 1; i >= 0; i--) {
    const b = game.burning[i];
    b.ramp = Math.min(b.ramp + dt / 2.5, 1);
    b.remain -= dt * (1 + blowStr * 0.25);
    const fade = clamp(b.remain / (b.spec.burnSec * 0.25), 0, 1);
    target = Math.max(target, b.spec.settle * b.ramp * fade);
    game.ember = Math.min(1, game.ember + b.spec.ember * hot * (dt / b.spec.burnSec));
    if (b.remain <= 0) game.burning.splice(i, 1);
  }
  // 薪を重ねる恩恵：同時に燃えている本数分、少しだけ火力が上がる
  if (game.burning.length > 1) target += Math.min(0.04 * (game.burning.length - 1), 0.12);
  // 沈んだ薪：火力が閾値を超え続ければ乾いて着火する（可逆）
  for (let i = game.pending.length - 1; i >= 0; i--) {
    const p = game.pending[i];
    if (game.heat >= p.spec.need) {
      p.warm += dt;
      if (p.warm > 1.6) {
        game.pending.splice(i, 1);
        game.burning.push({ spec: p.spec, remain: p.spec.burnSec, ramp: 0 });
        game.flare = Math.min(game.flare + 0.4, 1);
        sparkBurst(cx, baseY - 26 * S, 14, 160);
        AudioSys.flare();
        say('沈んでいた薪に火が回った', 3.5);
      }
    } else {
      p.warm = Math.max(0, p.warm - dt * 0.5);
    }
  }
  if (game.reward) target = Math.max(target, CONFIG.rewardSettle * 0.72);
  if (blowStr > 0.05 && game.heat > 0.02) target = Math.min(target + 0.32 * blowStr, 1.15);

  const rate = target > game.heat ? (blowStr > 0.4 ? 0.85 : 0.45) : 0.09;
  game.heat += (target - game.heat) * rate * dt;
  game.heat = clamp(game.heat, 0, 1.15);
  game.ember = Math.max(0, game.ember - 0.0025 * dt);
  game.flare = Math.max(0, game.flare - dt * 1.4);

  // ---- 消えた？（ご褒美前のみ・可逆に火花からやり直し） ----
  if (game.phase === 'tinder' && !game.reward &&
      game.heat < 0.03 && !game.tinder && game.burning.length === 0 && game.ember < 0.04) {
    game.phase = 'dark';
    game.ignite = 0;
    game.notch = 0;
    game.pending.length = 0;
    elTitle.classList.remove('hide');
    say('火が消えてしまった。もう一度、火花から。', 5);
  }

  // ---- ご褒美モード到達 ----
  if (!game.reward && game.ember >= CONFIG.rewardEmber) {
    game.reward = true;
    const sec = Math.max(1, Math.round(elapsed - game.litAt));
    // 到達の祝福：炎が一度大きく膨らみ、火の粉が柱になる
    game.flare = 1;
    sparkBurst(cx, baseY - 30 * S, 70, 300);
    AudioSys.flare();
    const mm = Math.floor(sec / 60), ss = sec % 60;
    document.querySelector('#banner .b2').textContent =
      `あなたが ${mm > 0 ? mm + '分' : ''}${ss}秒 かけて育てた火。もう消えない。あとは、ただ眺めるだけ。`;
    elBanner.classList.add('show');
    elClock.style.display = 'inline';
    setTimeout(() => elBanner.classList.remove('show'), 8000);
    // imapp: 1ラウンド終了（点火→熾火到達）。scoreは到達までの秒数（整数）
    IMAPP.send('game_over', { score: sec, timeToEmberSec: sec, logs: game.logsFed, damped: game.damped });
  }

  // ---- ステップガイド進行 ----
  if (!game.reward) {
    const burnt   = (id) => game.burning.some(b => b.spec.id === id) || game.pending.some(p => p.spec.id === id);
    const anyWood = game.burning.length > 0 || game.pending.length > 0;
    if (game.phase === 'dark') {
      if (guide.step !== 'strike') { setGuideStep('strike'); guide.fans = 0; }
    } else {
      switch (guide.step) {
        case 'strike':
          setGuideStep('blow');
          break;
        case 'blow':
          if ((guide.fans || 0) >= 5 || anyWood) setGuideStep('twig');
          break;
        case 'twig':
          if (anyWood) setGuideStep('grow');
          break;
        case 'grow':
          if (burnt('thick')) setGuideStep('tend');
          else {
            // 核心メカニクスに気づけない人への一度きりの助け舟
            const nextNeed = burnt('thin') ? CONFIG.adds[2].need : CONFIG.adds[1].need;
            if (game.heat < nextNeed - 0.02 && blowStr < 0.3) guide.stuck = (guide.stuck || 0) + dt;
            if ((guide.stuck || 0) > 8 && !guide.stuckSaid) {
              guide.stuckSaid = true;
              say('薪だけでは目盛りに届かない。「扇ぐ」を連打して、火力を押し上げてからくべよう', 7);
            }
          }
          break;
      }
    }
    // くべるべき薪ボタンをそっと点滅させる
    woodBtns[0].classList.toggle('guide', guide.step === 'twig');
    woodBtns[1].classList.toggle('guide', guide.step === 'grow' && !burnt('thin') && !burnt('thick'));
    woodBtns[2].classList.toggle('guide', guide.step === 'grow' && burnt('thin') && !burnt('thick'));
  } else if (guide.step) {
    setGuideStep(null);
  }

  // ---- サウンド ----
  AudioSys.update(dt, game.heat + game.flare * 0.4, blowStr);
  game.crackleT -= dt;
  if (game.crackleT <= 0 && game.heat > 0.05) {
    // 実録ループが鳴っているときは合成のパチパチを重ねない（イベント音は残す）
    if (!AudioSys.hasRealLoop) AudioSys.crackle(game.heat);
    game.crackleT = 0.05 + Math.random() * (0.55 / (0.15 + game.heat));
  }

  // ---- UI ----
  for (let i = 0; i < 3; i++) {
    cooldown[i] = Math.max(0, cooldown[i] - dt);
    const btn = woodBtns[i];
    const ok = game.heat >= CONFIG.adds[i].need && game.phase !== 'dark';
    btn.classList.toggle('ready', ok);
    btn.classList.toggle('cool', cooldown[i] > 0.15 || game.phase === 'dark');
    elTicks[i].classList.toggle('passed', ok);   // ゲージ目盛りも連動して光る
  }
  elFan.classList.toggle('cool', game.phase === 'dark');
  elFan.classList.toggle('guide', guide.step === 'blow');
  elFfill.style.width = (clamp(game.heat / 1.15, 0, 1) * 100).toFixed(1) + '%';
  elEfill.style.width = (clamp(game.ember / CONFIG.rewardEmber, 0, 1) * 100).toFixed(1) + '%';
  if (game.reward) {
    const s = Math.floor(elapsed - game.litAt);
    const mm = String(Math.floor(s / 60) % 60).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    const hh = Math.floor(s / 3600);
    elClock.textContent = (hh > 0 ? hh + ':' : '') + mm + ':' + ss;
  }
  uiIdle += dt;
  const fade = game.reward && uiIdle > 6;
  elWoodbar.classList.toggle('faded', fade);
  elFirebar.classList.toggle('faded', fade);
  elTopbar.classList.toggle('faded', fade);
}

/* =========================================================================
 *  メインループ
 * ========================================================================= */
let last = performance.now();
function frame(now){
  const dt = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  const t = now / 1000;

  update(dt, t);

  // コヒーレントな風（全体が同じ風でしなる）＋息の乱れ
  const wind = (Math.sin(t * 0.5) * 0.3 + Math.sin(t * 0.13 + 2) * 0.22 + Math.sin(t * 1.7) * 0.1) * CONFIG.swayAmp
             + blowStr * Math.sin(t * 9) * 0.25;

  const power = clamp(game.heat + game.flare * 0.35, 0, 1.15);
  const env = { ctx, cx, baseY, W, H, t, dt, power, heat: game.heat, wind, reduce: REDUCE };

  // LAYER2 更新
  updateSmoke(env);
  updateSparks(env);

  // 描画
  renderScene(env);
  renderGroundLight(env);
  renderSmoke(env);

  // LAYER1: イラスト → スプライト → パーティクルの順にフォールバック
  const illustDrawn = CONFIG.flameSource === 'illust' && illustFire.render(env);
  env.illust = illustDrawn;
  if (!illustDrawn) renderLogs(env);   // イラストは薪ごと描くので手続き薪は省略

  particleFlame.update(env);
  if (!illustDrawn && CONFIG.flameSource === 'sprite' && flameSprite.render(env)) {
    // sprite が描画した
  } else {
    particleFlame.render(env);         // イラスト時は動きの薄いパーティクルを上に重ねる
  }

  renderSparks(env);
  renderFireflies(env);
  renderVignette(env);
  renderIgnite(env);
  renderGuide(env);

  requestAnimationFrame(frame);
}

resize();
initLogPile();
setGuideStep('strike');
requestAnimationFrame(frame);
IMAPP.send('ready', { version: '1.0.0' });
</script>
