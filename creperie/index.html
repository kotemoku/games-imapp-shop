<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#171310">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<title>d'or — 花街のクレープリー</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Noto+Sans+JP:wght@400;500;700&family=Klee+One:wght@600&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-BhbCSZRl.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CpdMFzJQ.css">
</head>
<body>
<div id="stage">

  <button id="homeBtn" aria-label="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 L12 3 L21 11"/><path d="M5 10 V21 H19 V10"/><path d="M10 21 V14 H14 V21"/></svg>
  </button>

  <div id="welcome" class="screen">
    <div id="welcomeChef"></div>
    <div id="welcomeMsg">
      <div class="wEyebrow">La Crêperie du Coin</div>
      <div class="wTitle">Bienvenue</div>
      <div class="wBubble" id="wBubble"></div>
      <button id="welcomeBtn"></button>
    </div>
  </div>

  <div id="hub" class="screen">
    <div id="hubL">
      <div class="hubHead">
        <div>
          <div class="hubTitle" id="hubTitle">d'or</div>
          <div class="hubSub" id="hubSub"></div>
        </div>
        <div id="rankBadge"></div>
        <div id="hubTools">
          <button class="tool" id="recBtn"></button>
          <button class="tool" id="langBtn">EN</button>
          <button class="tool" id="sndBtn">♪ ON</button>
        </div>
      </div>
      <div id="menu"></div>
      <div id="hubFoot"></div>
    </div>
    <img id="rareStaff" alt="">
  </div>

  <div id="records" class="ovl"><div class="card dark wideCard">
    <div class="eb">Palmarès</div>
    <h2 id="recTitle"></h2>
    <div id="recBody"></div>
    <button class="act btn-main" id="recClose" style="width:100%"></button>
  </div></div>

  <div id="lecture" class="screen">
    <div id="lecBoard"></div>
    <div id="lecStaff"></div>
  </div>

  <div id="game" class="screen">
    <div id="svcBar"></div>
    <div id="gameRow">
      <div id="cvWrap"><canvas id="cv"></canvas><div id="tray"></div></div>
      <aside id="panel"></aside>
    </div>
  </div>

  <div id="svcHome" class="screen">
    <div id="svcStage">
      <div id="svcQueue"></div>
      <div class="obubble" id="svcBubble"></div>
      <div id="svcGuest">
        <div id="svcAvatar"></div>
      </div>
    </div>
    <aside id="svcSide"></aside>
  </div>

  <div id="modeSel" class="ovl"><div class="card wideCard">
    <div class="eb">Le Service</div>
    <h2 id="msTitle"></h2>
    <div id="modeGrid"></div>
    <button class="act btn-reset" id="msBack" style="width:100%;"></button>
  </div></div>

  <div id="mariage" class="ovl"><div class="card wideCard" id="marCard"></div></div>

  <div id="result" class="ovl"><img id="rPraise" alt=""><div class="card">
    <div class="eb" id="rTitle"></div>
    <div class="stars" id="rStars"></div>
    <canvas id="rCanvas" width="150" height="180"></canvas>
    <div class="score" id="rScore"></div>
    <div class="verdict" id="rVerdict"></div>
    <div class="breakdown" id="rRows"></div>
    <div id="rBtns"></div>
  </div></div>

  <div class="toast" id="toast"></div>

</div>
</body>
</html>
