<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MOCME モクメ — 木目合わせジグソー</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#efe7d6">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MOCME">
<meta name="description" content="形は一切ヒントにならない。京ヒノキの木目の連続だけを頼りに、正しい面・向き・位置を見抜く観察パズル。">
<style>
  /* ===== 京都の工房ミニマル / washi × sumi ===== */
  :root{
    --washi:#efe7d6; --washi2:#e6dcc6; --sumi:#2b2622; --sumi2:#5c5346;
    --hinoki:#d9ad85; --akami:#c98f6a; --gold:#b8935a; --line:#cbbfa6;
    --ok:#6f9e6a; --ng:#c07a6a;
    --font:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',system-ui,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;width:100%;overflow:hidden;position:fixed;
    overscroll-behavior:none;touch-action:none;background:var(--washi);color:var(--sumi);
    font-family:var(--font); -webkit-font-smoothing:antialiased; user-select:none;}
  #stage{position:fixed;inset:0;display:block;touch-action:none;}

  /* washi 質感の背景 */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(120% 80% at 50% -10%, #f7f0e2 0%, transparent 55%),
      radial-gradient(120% 120% at 50% 120%, #e2d7bf 0%, transparent 60%),
      var(--washi);}

  .row{display:flex;align-items:center;gap:10px;}
  button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit;}
  .btn{padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.55);
    border:1px solid var(--line);color:var(--sumi);font-size:14px;font-weight:600;
    letter-spacing:.04em;transition:.18s;backdrop-filter:blur(4px);}
  .btn:hover{background:#fff;transform:translateY(-1px);box-shadow:0 6px 18px rgba(80,60,30,.12);}
  .btn:active{transform:translateY(0);}
  .btn.primary{background:var(--sumi);color:#f3ecdd;border-color:var(--sumi);}
  .btn.primary:hover{background:#3b342c;}
  .btn.ghost{background:transparent;}

  /* ===== 上部バー ===== */
  #topbar{position:fixed;top:0;left:0;right:0;height:58px;z-index:10;
    display:flex;align-items:center;justify-content:space-between;padding:0 16px;
    padding-top:env(safe-area-inset-top);background:linear-gradient(#efe7d6ea,#efe7d600);}
  .brand{display:flex;align-items:baseline;gap:9px;font-weight:800;letter-spacing:.14em;}
  .brand .k{font-size:22px;color:var(--akami);}
  .brand .n{font-size:17px;}
  .brand .jp{font-size:11px;color:var(--sumi2);letter-spacing:.32em;}
  #meta{font-size:12.5px;color:var(--sumi2);letter-spacing:.06em;text-align:center;}
  #meta b{color:var(--sumi);font-weight:700;}

  /* ===== 下部インスペクタ ===== */
  #dock{position:fixed;left:0;right:0;bottom:0;height:140px;z-index:10;
    display:flex;align-items:center;gap:14px;padding:10px 16px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(#efe7d600,#efe7d6f2 40%);}
  #previewWrap{width:120px;height:120px;flex:0 0 auto;border-radius:50%;
    background:radial-gradient(circle at 50% 42%, rgba(255,255,255,.6), rgba(255,255,255,.28));
    border:1px solid var(--line);position:relative;
    display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 10px rgba(90,70,40,.12);}
  #previewWrap::after{content:"";position:absolute;inset:6px;border-radius:50%;
    border:1.5px dashed rgba(150,120,80,.35);pointer-events:none;}
  #previewWrap.empty2::after{opacity:0;}
  #preview{border-radius:10px;pointer-events:none;}
  .dockInfo{flex:1 1 auto;min-width:0;}
  .dockInfo .h{font-weight:700;font-size:14px;}
  .dockInfo .s{font-size:11.5px;color:var(--sumi2);margin-top:3px;line-height:1.5;}
  .dockBtns{display:flex;gap:8px;flex:0 0 auto;}
  .iconbtn{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.6);
    border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2px;font-size:10px;font-weight:600;color:var(--sumi2);transition:.16s;}
  .iconbtn svg{width:22px;height:22px;stroke:var(--sumi);}
  .iconbtn:hover{background:#fff;transform:translateY(-2px);}
  .iconbtn:disabled{opacity:.35;transform:none;cursor:default;}
  #dock.empty{opacity:.55;}

  /* ===== オーバーレイ（メニュー / 勝利 / 見本帳） ===== */
  .overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    padding:24px;background:radial-gradient(120% 90% at 50% 30%, #f3ecdeee, #e6dcc6f7);}
  .overlay.hidden{display:none;}
  .panel{width:min(680px,100%);text-align:center;}
  .display{font-weight:900;letter-spacing:.02em;line-height:1;}
  .kanji{font-size:clamp(56px,13vw,120px);color:var(--sumi);position:relative;display:inline-block;}
  .kanji .grain{position:absolute;inset:0;background:linear-gradient(115deg,#e6b483,#caa06f 40%,#b98a5f 70%,#dfb488);
    -webkit-background-clip:text;background-clip:text;color:transparent;mix-blend-mode:normal;}
  .sub{margin-top:14px;font-size:14px;color:var(--sumi2);letter-spacing:.34em;}
  .lead{margin:22px auto 4px;max-width:440px;font-size:13.5px;line-height:2;color:var(--sumi2);letter-spacing:.03em;}

  .sizes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px;}
  .sizeCard{width:104px;padding:14px 8px;border-radius:16px;background:rgba(255,255,255,.5);
    border:1px solid var(--line);transition:.18s;cursor:pointer;}
  .sizeCard:hover{background:#fff;transform:translateY(-3px);box-shadow:0 10px 26px rgba(90,60,20,.14);}
  .sizeCard .num{font-size:30px;font-weight:900;line-height:1;}
  .sizeCard .grid{font-size:11px;color:var(--sumi2);margin-top:4px;}
  .sizeCard .tag{margin-top:8px;font-size:10.5px;letter-spacing:.14em;color:var(--akami);font-weight:700;}

  .modeRow{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap;}
  .seg{display:inline-flex;background:rgba(255,255,255,.5);border:1px solid var(--line);
    border-radius:999px;padding:4px;gap:2px;}
  .seg button{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--sumi2);}
  .seg button.on{background:var(--sumi);color:#f3ecdd;}

  #win .kanji{color:var(--sumi);}
  .winStats{margin-top:18px;font-size:14px;color:var(--sumi2);letter-spacing:.08em;}
  .winStats b{color:var(--sumi);font-size:20px;}
  .winReward{margin:18px auto 0;max-width:400px;padding:14px 18px;border-radius:14px;
    background:linear-gradient(135deg,#fff6e9,#f3e4cd);border:1px dashed var(--gold);
    box-shadow:0 6px 18px rgba(140,100,40,.14);}
  .winReward .rl{font-size:10.5px;letter-spacing:.22em;color:var(--akami);font-weight:700;}
  .winReward .rv{margin-top:6px;font-size:13.5px;color:var(--sumi);line-height:1.6;}
  .winReward .rs{margin-top:6px;font-size:10.5px;color:var(--sumi2);}
  .winReward.hidden{display:none;}

  .collGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;
    max-height:60vh;overflow:auto;margin-top:20px;padding:4px;}
  .collItem{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff;
    box-shadow:0 4px 12px rgba(90,60,20,.1);}
  .collItem img{width:100%;display:block;aspect-ratio:1;object-fit:cover;}
  .collItem .cap{font-size:10px;padding:5px;color:var(--sumi2);}
  .collEmpty{margin-top:30px;color:var(--sumi2);font-size:13px;letter-spacing:.1em;}

  #loader{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;gap:18px;
    align-items:center;justify-content:center;background:#efe7d6f5;}
  #loader.hidden{display:none;}
  .spinner{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);
    border-top-color:var(--akami);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #loader .lt{font-size:12px;letter-spacing:.3em;color:var(--sumi2);}

  .toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:20;
    background:var(--sumi);color:#f3ecdd;padding:10px 20px;border-radius:999px;font-size:13px;
    letter-spacing:.06em;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2);}
  .toast.show{opacity:1;}

  .hidden{display:none !important;}
  a.credit{position:fixed;bottom:112px;right:14px;font-size:10px;color:var(--sumi2);opacity:.6;
    text-decoration:none;letter-spacing:.08em;z-index:9;}
  @media (max-width:560px){
    #meta{display:none;}
    #dock{height:120px;}
    #previewWrap{width:96px;height:96px;}
    .iconbtn{width:48px;height:48px;}
  }
</style>
  <script type="module" crossorigin src="./assets/index-CSjC_GAw.js"></script>
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="topbar">
    <div class="brand"><span class="k">杢</span><span class="n">MOCME</span><span class="jp">モクメ</span></div>
    <div id="meta"></div>
    <div class="row">
      <button class="btn ghost" id="btnAmb" title="静かな和のアンビエント">🎐 静</button>
      <button class="btn" id="btnCheck">答え合わせ</button>
      <button class="btn ghost" id="btnMenu">≡</button>
    </div>
  </div>

  <div id="dock" class="empty">
    <div id="previewWrap"><canvas id="preview" width="72" height="72"></canvas></div>
    <div class="dockInfo">
      <div class="h" id="dockH">手元インスペクタ</div>
      <div class="s" id="dockS">ピースを選ぶと、ここで<b>反転（表裏）</b>と<b>回転</b>ができます。形はヒントになりません — 木目の連続だけを頼りに。</div>
    </div>
    <div class="dockBtns">
      <button class="iconbtn" id="btnRotate" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>回転</button>
      <button class="iconbtn" id="btnFlip" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M7 8 4 12l3 4"/><path d="M17 8l3 4-3 4"/></svg>反転</button>
      <button class="iconbtn" id="btnDrop" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>手放す</button>
    </div>
  </div>

  <a class="credit" href="#" id="btnColl">▦ 木材見本帳</a>

  <!-- タイトル / メニュー -->
  <div class="overlay" id="title">
    <div class="panel">
      <div class="display"><span class="kanji">杢目<span class="grain">杢目</span></span></div>
      <div class="sub">M O C M E ・ 木 目 合 わ せ</div>
      <p class="lead">形は、一切ヒントにならない。<br>四辺が同じピースの中から、木目が繋がる<b>唯一の並び</b>を見抜く。<br>正しい<b>面・向き・位置</b>を決めるのは、京ヒノキの木目だけ。</p>

      <div class="modeRow">
        <div class="seg" id="modeSeg">
          <button data-mode="endless" class="on">エンドレス</button>
          <button data-mode="daily">デイリー</button>
          <button data-mode="time">タイムアタック</button>
        </div>
        <div class="seg" id="assistSeg">
          <button data-assist="auto" class="on">判定：おまかせ</button>
          <button data-assist="strict">ストリクト</button>
          <button data-assist="assist">アシスト</button>
        </div>
      </div>

      <div class="sizes" id="sizes"></div>
      <div style="margin-top:22px" class="row" style="justify-content:center">
        <button class="btn ghost" id="btnCollFromTitle">▦ 見本帳を見る</button>
      </div>
    </div>
  </div>

  <!-- 勝利 -->
  <div class="overlay hidden" id="win">
    <div class="panel">
      <div class="display"><span class="kanji" id="winKanji">完成</span></div>
      <div class="sub" id="winSub">京ヒノキ ・ 板目</div>
      <div class="winStats" id="winStats"></div>
      <div class="winReward hidden" id="winReward"></div>
      <div class="row" style="justify-content:center;margin-top:26px">
        <button class="btn primary" id="btnAgain">もう一枚</button>
        <button class="btn" id="btnShare">結果を共有</button>
        <button class="btn" id="btnWinMenu">メニュー</button>
      </div>
    </div>
  </div>

  <!-- 見本帳 -->
  <div class="overlay hidden" id="collection">
    <div class="panel">
      <div class="display"><span class="kanji" style="font-size:clamp(40px,9vw,72px)">木材見本帳</span></div>
      <div class="sub">C O L L E C T I O N ・ 記 録</div>
      <div id="records" style="margin-top:18px;font-size:12.5px;color:var(--sumi2);line-height:2;letter-spacing:.03em"></div>
      <div class="collGrid" id="collGrid"></div>
      <div class="collEmpty hidden" id="collEmpty">まだ一枚も完成していません。<br>木目を読み解き、見本帳を満たしましょう。</div>
      <div class="row" style="justify-content:center;margin-top:24px">
        <button class="btn" id="btnCollClose">とじる</button>
      </div>
    </div>
  </div>

  <div id="loader" class="hidden"><div class="spinner"></div><div class="lt">京ヒノキを製材しています…</div></div>
  <div class="toast" id="toast"></div>

</body>
</html>
