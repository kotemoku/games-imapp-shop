<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="モッケルン" />
    <meta name="theme-color" content="#e2b474" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>モッケルン</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        /* 画面を固定してスクロール／引っぱり更新／端スワイプの余地を無くす */
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #f6efe1;
        overflow: hidden;
        /* タッチ操作のブラウザ既定挙動（ダブルタップズーム・引っぱり更新等）を抑制 */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        font-family: 'Kosugi Maru', 'Noto Sans JP', sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* 起動スプラッシュ：JS読込・Phaser起動中の無地画面を無くす（Boot開始で除去） */
      #splash {
        position: fixed;
        inset: 0;
        background: #f6efe1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        z-index: 10;
      }
      #splash .blocks {
        display: flex;
        gap: 10px;
      }
      #splash .blocks span {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        animation: splash-bounce 0.9s ease-in-out infinite;
      }
      #splash .blocks span:nth-child(1) { background: #477bbc; }
      #splash .blocks span:nth-child(2) { background: #598540; animation-delay: 0.15s; }
      #splash .blocks span:nth-child(3) { background: #d42d33; animation-delay: 0.3s; }
      #splash .blocks span:nth-child(4) { background: #e6b37d; animation-delay: 0.45s; }
      @keyframes splash-bounce {
        0%, 100% { transform: translateY(0); }
        40% { transform: translateY(-14px); }
      }
      #splash .t {
        color: #6b4a2a;
        font-weight: bold;
        font-size: 20px;
        letter-spacing: 0.2em;
      }
      #splash .s {
        color: #a2864f;
        font-size: 12px;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DL9EELT_.js"></script>
  </head>
  <body>
    <div id="splash">
      <div class="blocks"><span></span><span></span><span></span><span></span></div>
      <div class="t">モッケルン</div>
      <div class="s">よみこみちゅう… / Loading…</div>
    </div>
    <div id="game"></div>
  </body>
</html>
