<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>バーガー射的 — BURGERELEVEN</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2a1a10; /* 店内の暗がり */
        /* 日本語UIは Noto Sans JP で統一 */
        font-family: "Noto Sans JP", system-ui, sans-serif;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* 縦持ち時の回転案内。本番は Capacitor / ネイティブ設定で landscape 固定（WORKORDER §0-5） */
      #rotate-hint {
        position: fixed;
        inset: 0;
        z-index: 99;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #1c1008;
        color: #f4e8d8;
        text-align: center;
        font-weight: 700;
        font-size: 15px;
        line-height: 1.9;
      }
      #rotate-hint .ph {
        font-size: 56px;
        animation: rot 1.6s ease-in-out infinite;
      }
      @keyframes rot {
        0%,
        25% {
          transform: rotate(0);
        }
        60%,
        100% {
          transform: rotate(90deg);
        }
      }
      @media (orientation: portrait) {
        #rotate-hint {
          display: flex;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BiMd8pAn.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint">
      <div class="ph">📱</div>
      <p>スマホを<b>横向き</b>にしてください<br /><small>バーガー射的は横持ち専用です</small></p>
    </div>
  </body>
</html>
